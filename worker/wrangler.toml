# make it nice — Cloudflare Worker config
# Deploy: npm run deploy (see docs/deploy-cloudflare.md)
name = "make-it-nice"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Serve the static site from the same Worker (optional; delete this block for API-only).
[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "make-it-nice"
database_id = "48465ef5-f087-49d1-917e-2b704123cc5c"
migrations_dir = "migrations"

[vars]
# Comma-separated origins allowed to call the API, or * for any (fine: nothing here is secret).
ALLOWED_ORIGINS = "*"

# Secrets (never in this file): ADMIN_TOKEN  →  npx wrangler secret put ADMIN_TOKEN
