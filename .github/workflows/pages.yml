name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Optional: point the site at a different API by setting the repository variable API_BASE
      # (Settings → Secrets and variables → Actions → Variables). Empty = keep what's in site/config.js.
      - name: Apply API_BASE repository variable
        if: ${{ vars.API_BASE != '' }}
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          sed -i "s#API_BASE: '[^']*'#API_BASE: '${API_BASE}'#" site/config.js
          grep -n "API_BASE" site/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
