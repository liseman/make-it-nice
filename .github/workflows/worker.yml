name: Deploy Worker to Cloudflare

# Opt-in: set repository variable DEPLOY_WORKER=true and the secrets
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions).
# Until then this workflow is skipped and you deploy with `npm run deploy` in worker/.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'site/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.DEPLOY_WORKER == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: worker
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply make-it-nice --remote
        working-directory: worker
      - name: Deploy
        run: npx wrangler deploy
        working-directory: worker
